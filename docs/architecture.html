  <title id="t">FarmXpert architecture</title>
  <desc id="d">The Next.js frontend (canopy) talks to the Node API (trunk) over REST with JWT and receives streamed answers.
  The API owns PostgreSQL with PostGIS and pgvector (bedrock), and calls the FastAPI multi-agent AI backend (roots)
  with a shared internal key. The AI runs seven expert agents and uses OpenAI and OpenWeather; the API uses Blynk and data.gov.in.</desc>
