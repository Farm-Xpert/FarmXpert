# One public origin for the whole app (docker compose --profile proxy up).
# /api/* goes to the Node API, everything else to Next.js.
# Build the frontend with PUBLIC_API_URL set to this origin (e.g. http://localhost).

upstream frontend { server frontend:3000; }
upstream backend  { server backend:4000; }

server {
  listen 80;
  server_name _;
  client_max_body_size 4m;                 # voice recordings (2 MB) with headroom

  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # answers stream as server-sent events: never buffer them
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
