# ============================================================================
# FarmXpert - the whole stack in Docker
#
#   db        PostgreSQL 16 + PostGIS + pgvector
#   migrate   one-shot: applies the database migrations, then exits
#   ai        Python / FastAPI  - the multi-agent AI backend       :8000
#   backend   Node / Express    - the API the app talks to         :4000
#   frontend  Next.js           - landing page, auth, dashboard    :3000
#   proxy     Nginx (optional)  - one origin on :80  (--profile proxy)
#
# First run:
#   cp .env.example .env                      # set the passwords and keys
#   cp Backend/.env.example Backend/.env      # service settings (API keys, SMTP, ...)
#   cp AI_Backend/.env.example AI_Backend/.env
#   docker compose up -d --build
#   docker compose exec backend npm run seed:demo   # optional demo farmer + admin
#
# Each service reads its own .env; the values below override only what must
# differ inside Docker (addresses on the compose network, the database).
# ============================================================================

name: farmxpert

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  db:
    build: ./docker/postgres
    image: farmxpert/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmxpert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-farmxpert}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"       # reachable from this machine only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  migrate:
    build: ./Backend
    image: farmxpert/backend
    command: ["node", "src/db/migrate.js"]
    env_file: [{ path: ./Backend/.env, required: false }]
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-farmxpert}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-farmxpert}}
      DB_SSL: ${DB_SSL:-disable}
      AI_BACKEND_URL: http://ai:8000
      APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}      # true once served over HTTPS
      PORT: 4000
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging

  ai:
    build: ./AI_Backend
    image: farmxpert/ai
    restart: unless-stopped
    env_file: [{ path: ./AI_Backend/.env, required: false }]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-farmxpert}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-farmxpert}}
      BACKEND_BASE_URL: http://backend:4000
    volumes:
      - ai-cache:/app/.cache                     # downloaded models survive rebuilds
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"        # internal service: not published publicly
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  backend:
    image: farmxpert/backend
    restart: unless-stopped
    env_file: [{ path: ./Backend/.env, required: false }]
    environment: *backend-env
    volumes:
      - archive:/app/archive
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      ai: { condition: service_healthy }
    logging: *logging

  frontend:
    build:
      context: ./Frontend
      args:
        # baked into the browser bundle: the address the *browser* uses for the API
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    image: farmxpert/frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend: { condition: service_healthy }
    logging: *logging

  proxy:
    image: nginx:1.27-alpine
    profiles: [proxy]
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_PORT:-80}:80"
    depends_on: [frontend, backend]
    logging: *logging

volumes:
  pgdata:
  ai-cache:
  archive:
